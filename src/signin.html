<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Combox - Sign In</title>
        <link rel="icon" type="image/png" href="icons/icono.png">
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }

            body {
                background-color: #E89684;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            .card {
                background-color: #ffffff;
                padding: 40px 32px;
                border-radius: 12px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
                width: 100%;
                max-width: 380px;
            }

            .header {
                text-align: center;
                margin-bottom: 28px;
            }

            .brand-icon {
                width: 56px;
                height: 56px;
                margin-bottom: 12px;
            }

            h2 {
                color: #2b2b2b;
                font-size: 24px;
                margin-bottom: 6px;
            }

            p.subtitle {
                color: #666666;
                font-size: 14px;
            }

            .form-group {
                margin-bottom: 18px;
                text-align: left;
            }

            label {
                display: block;
                font-size: 13px;
                font-weight: 600;
                color: #444444;
                margin-bottom: 6px;
            }

            input[type="email"],
            input[type="password"] {
                width: 100%;
                padding: 12px 14px;
                border: 1px solid #d1d5db;
                border-radius: 6px;
                font-size: 14px;
                color: #1f2937;
                outline: none;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            input[type="email"]:focus,
            input[type="password"]:focus {
                border-color: #E89684;
                box-shadow: 0 0 0 3px rgba(232, 150, 132, 0.25);
            }

            .btn-submit {
                width: 100%;
                padding: 12px;
                background-color: #E89684;
                color: #ffffff;
                border: none;
                border-radius: 6px;
                font-size: 15px;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s ease, transform 0.1s ease;
                margin-top: 8px;
            }

            .btn-submit:hover {
                background-color: #d67f6d;
            }

            .btn-submit:active {
                transform: scale(0.98);
            }

            .footer-links {
                text-align: center;
                margin-top: 24px;
                font-size: 13px;
                color: #666666;
            }

            .footer-links a {
                color: #d67f6d;
                text-decoration: none;
                font-weight: 600;
            }

            .footer-links a:hover {
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="header">
                <img src="icons/icono.png" alt="Combox Logo" class="brand-icon">
                <h2>Sign In</h2>
                <p class="subtitle">Enter your credentials to continue</p>
            </div>

            <form action="signin.php" method="POST">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="passwd">Password</label>
                    <input type="password" id="passwd" name="passwd" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="footer-links">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </body>
</html>
